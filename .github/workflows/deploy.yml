# develop → 베타 (develop.pixel-rogue.pages.dev, pixel-rogue-beta 서버)
# test    → 시험 (test.pixel-rogue.pages.dev, pixel-rogue-test 서버. 저장소도 따로)
# main    → 라이브 (pixel-rogue.pages.dev, pixel-rogue 서버)
# 화면·서버 중 바뀐 쪽만 배포. Actions 화면에서 수동 실행하면 둘 다 배포
name: Deploy

on:
  push:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.client == 'true' }}
      server: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.server == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # 같은 브랜치의 이전 커밋과 비교 (지정하지 않으면 develop이 main과 비교돼 매번 전부 배포됨)
          base: ${{ github.ref_name }}
          filters: |
            client:
              - '.github/workflows/deploy.yml'
              - 'apps/client/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
            server:
              - '.github/workflows/deploy.yml'
              - 'apps/server/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  client:
    needs: [changes, check]
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_SERVER_URL: ${{ github.ref_name == 'main' && 'https://pixel-rogue.numgame.workers.dev' || github.ref_name == 'test' && 'https://pixel-rogue-test.donggyun0905.workers.dev' || 'https://pixel-rogue-beta.numgame.workers.dev' }}
      - name: Create Pages project (first time only)
        run: npx wrangler pages project create pixel-rogue-test --production-branch=main || echo "already exists"
      - name: Deploy to Pages
        run: npx wrangler pages deploy apps/client/dist --project-name=pixel-rogue-test --branch=${{ github.ref_name }} --commit-dirty=true

  server:
    needs: [changes, check]
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy Worker
        working-directory: apps/server
        run: npx wrangler deploy ${{ github.ref_name == 'main' && ' ' || github.ref_name == 'test' && '--env test' || '--env beta' }}
